name: Build and Commit hypertyper.exe

on:
  push:
    branches: [ main, master ]
  release:
    types: [ published ]
  workflow_dispatch:  # 允许手动触发

env:
  OUTPUT_NAME: hypertyper

jobs:
  build-and-commit:
    runs-on: windows-latest
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
      with:
        token: ${{ secrets.GITHUB_TOKEN }}
        fetch-depth: 0  # 获取所有历史记录

    - name: Set up Python
      uses: actions/setup-python@v4
      with:
        python-version: '3.11'
        
    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install PyQt6 pywin32 pyinstaller
        
    - name: Verify installations
      run: |
        python -c "import PyQt6; print('PyQt6 OK')"
        python -c "import win32api; print('pywin32 OK')"
        pyinstaller --version
        
    - name: Build executable
      run: |
        pyinstaller --onefile --windowed --name ${{ env.OUTPUT_NAME }} main.py
        
    - name: Verify executable
      run: |
        dir dist
        echo "文件大小:"
        ls -la dist/${{ env.OUTPUT_NAME }}.exe
        
    - name: Create releases directory
      run: |
        if (!(Test-Path "releases")) {
          New-Item -ItemType Directory -Path "releases" -Force
        }
        
    - name: Copy executable to releases
      run: |
        Copy-Item "dist/${{ env.OUTPUT_NAME }}.exe" "releases/${{ env.OUTPUT_NAME }}.exe" -Force
        
    - name: Commit executable to repository
      run: |
        git config --local user.email "action@github.com"
        git config --local user.name "GitHub Action"
        git add releases/${{ env.OUTPUT_NAME }}.exe
        git commit -m "chore: build ${{ env.OUTPUT_NAME }}.exe from ${{ github.sha }}" -m "Automated build from GitHub Actions"
        git push